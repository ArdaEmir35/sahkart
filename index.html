<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Chromate — Chess with Cards</title>
  <meta name="theme-color" content="#12161f">
  <meta name="description" content="Chromate: a chess board and colorful cards. Play against the bot or online with friends.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chromate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>♚ <span data-i18n="brand">Chromate</span> <small data-i18n="tagline">chess with cards</small></h1>
    <div class="header-right">
      <select id="lang-sel" class="lang-sel" data-i18n-aria="hdr.lang"><option value="en">EN</option><option value="tr">TR</option></select>
      <button id="sound-btn" class="ghost icon">🔊</button>
      <button id="feedback-btn" class="ghost icon" data-i18n-title="hdr.feedback">✉️</button>
      <button id="rules-btn" class="ghost" data-i18n="hdr.rules">Rules</button>
      <span id="net-status" class="net-status hidden"></span>
      <label id="speed-wrap"><span class="speed-lbl" data-i18n="hdr.speed">Bot speed</span>
        <select id="speed">
          <option value="1400" data-i18n="speed.slow">Slow</option>
          <option value="800" selected data-i18n="speed.normal">Normal</option>
          <option value="300" data-i18n="speed.fast">Fast</option>
        </select>
      </label>
      <button id="resign-btn" class="ghost danger hidden" data-i18n="hdr.resign">🏳 Resign</button>
      <button id="new-game" class="ghost" data-i18n="hdr.new">New Game</button>
    </div>
  </header>

  <div id="rules" class="hidden">
    <h3 data-i18n="rules.title">How to play</h3>
    <ul>
      <li data-i18n-html="rules.1"></li>
      <li data-i18n-html="rules.2"></li>
      <li data-i18n-html="rules.3"></li>
      <li data-i18n-html="rules.4"></li>
      <li data-i18n-html="rules.5"></li>
      <li data-i18n-html="rules.6"></li>
      <li data-i18n-html="rules.7"></li>
      <li data-i18n-html="rules.8"></li>
      <li data-i18n-html="rules.9"></li>
      <li data-i18n-html="rules.10"></li>
    </ul>
  </div>

  <main>
    <section class="play">
      <div id="coach" class="hidden">
        <div class="coach-head"><span>🎓</span> <b id="coach-step"></b><span id="coach-dots" class="dots"></span></div>
        <p id="coach-text"></p>
        <div class="coach-btns">
          <button id="coach-exit" class="ghost" data-i18n="coach.exit">Exit tutorial</button>
          <span class="coach-right">
            <button id="coach-hint" class="ghost hidden" data-i18n="pz.hint"></button>
            <button id="coach-retry" class="ghost hidden" data-i18n="pz.retry"></button>
            <button id="coach-next" class="hidden">Next →</button>
          </span>
        </div>
      </div>
      <div class="hand-row opp-row">
        <div class="who">
          <span id="turn-opp" class="turn"><span id="opp-label"></span></span>
          <span id="bubble-opp" class="bubble hidden"></span>
          <span id="clock-opp" class="clock hidden"></span>
        </div>
        <div id="opp-hand" class="hand small"></div>
      </div>

      <div class="board-wrap">
        <div id="board"></div>
        <div id="files" class="files"></div>
      </div>

      <div id="status"></div>
      <div id="mobile-slot"></div>

      <div class="hand-row">
        <div class="who">
          <span id="turn-me" class="turn" data-i18n="name.you">You</span>
          <span id="clock-me" class="clock hidden"></span>
          <button id="chat-btn" class="chat-btn hidden" data-i18n-title="chat.title">💬<span id="chat-badge" class="badge hidden"></span></button>
          <span id="bubble-me" class="bubble me hidden"></span>
        </div>
        <div id="my-hand" class="hand"></div>
      </div>
    </section>

    <aside>
      <div id="table-center" class="table-center">
      <div class="center">
        <div class="pile-box">
          <div class="cap" data-i18n="pile.top">Top card</div>
          <div id="pile"></div>
        </div>
        <div class="pile-box">
          <div class="cap" id="deck-cap">Deck</div>
          <button id="draw-btn" class="deck-btn"><div class="card back"></div><span id="draw-label">Draw</span></button>
        </div>
      </div>
      <div class="active-row"><span data-i18n="active.color">Current color:</span> <span id="active-color"></span></div>
      </div>
      <h2 data-i18n="log.title">Move history</h2>
      <div id="log"></div>
    </aside>
  </main>

  <div id="overlay" class="hidden">
    <div class="modal">
      <div id="color-pick" class="hidden">
        <h3 data-i18n="color.pick">Pick the new color</h3>
        <div class="colors">
          <button data-color="0" class="c0" data-i18n="color.0"></button>
          <button data-color="1" class="c1" data-i18n="color.1"></button>
          <button data-color="2" class="c2" data-i18n="color.2"></button>
          <button data-color="3" class="c3" data-i18n="color.3"></button>
        </div>
      </div>
      <div id="result" class="hidden">
        <h3 id="overlay-title"></h3>
        <p id="overlay-text"></p>
        <button id="again">Play Again</button>
      </div>
    </div>
  </div>

  <div id="lobby" class="hidden">
    <div class="modal lobby">
      <select id="lang-sel-lobby" class="lang-sel lobby-lang" data-i18n-aria="hdr.lang"><option value="en">English</option><option value="tr">Türkçe</option></select>
      <div class="logo">♚</div>
      <h2 data-i18n="brand">Chromate</h2>
      <p class="sub" data-i18n="lobby.sub"></p>

      <div id="lobby-menu">
        <label class="tc-row"><span data-i18n="tc.label">⏱ Time</span>
          <select id="time-ctrl">
            <option value="0"></option>
            <option value="60+2"></option>
            <option value="180+2"></option>
            <option value="300+0"></option>
            <option value="300+3"></option>
            <option value="600+0"></option>
            <option value="600+5"></option>
            <option value="900+10"></option>
          </select>
        </label>
        <button id="btn-resume" class="big resume hidden" data-i18n="lobby.resume"></button>
        <button id="btn-tutorial" class="big tut"><span data-i18n="lobby.tutorial"></span> <small data-i18n="lobby.tutorialSub"></small></button>
        <button id="btn-puzzles" class="big puzzles" data-i18n="lobby.puzzles"></button>
        <button id="btn-bot" class="big" data-i18n="lobby.bot"></button>
        <div id="level" class="level-row" role="radiogroup" data-i18n-aria="lobby.level">
          <button data-level="easy" data-i18n="level.easy"></button>
          <button data-level="normal" data-i18n="level.normal"></button>
          <button data-level="hard" data-i18n="level.hard"></button>
        </div>
        <div class="sep" data-i18n="lobby.online"></div>
        <button id="btn-quick" class="big quick" data-i18n="lobby.quick"></button>
        <button id="btn-host" class="big alt" data-i18n="lobby.host"></button>
        <div class="join-row">
          <input id="join-code" maxlength="4" data-i18n-ph="lobby.codePh" autocomplete="off" autocapitalize="characters">
          <button id="btn-join" class="big alt" data-i18n="lobby.join"></button>
        </div>
        <p id="lobby-error" class="err"></p>
        <button id="btn-install" class="ghost install hidden" data-i18n="lobby.install"></button>
        <p id="ios-install" class="install-tip hidden" data-i18n-html="lobby.ios"></p>
        <div class="lobby-foot">
          <button id="btn-feedback" class="linkbtn" data-i18n="footer.feedback"></button> ·
          <a href="privacy.html" target="_blank" rel="noopener" data-i18n="footer.privacy"></a> ·
          <button id="btn-stats" class="linkbtn"></button>
        </div>
      </div>

      <div id="lobby-puzzles" class="hidden">
        <button id="pz-daily" class="big puzzles"></button>
        <div id="pz-grid" class="pz-grid"></div>
        <button id="pz-back" class="ghost" data-i18n="pz.back"></button>
      </div>

      <div id="lobby-hosting" class="hidden">
        <p data-i18n="lobby.yourCode"></p>
        <div id="room-code" class="room-code">····</div>
        <p class="sub" data-i18n="lobby.share"></p>
        <div class="join-row">
          <input id="room-link" readonly>
          <button id="copy-link" class="alt" data-i18n="lobby.copy"></button>
        </div>
        <p class="wait"><span class="spinner"></span> <span data-i18n="lobby.waitFriend"></span></p>
        <button id="cancel-host" class="ghost" data-i18n="lobby.cancel"></button>
      </div>

      <div id="lobby-searching" class="hidden">
        <p class="wait"><span class="spinner"></span> <span data-i18n="lobby.searching"></span> <span class="sub">(<span id="search-tc"></span>)</span></p>
        <p class="sub" data-i18n="lobby.searchInfo"></p>
        <button id="cancel-search" class="ghost" data-i18n="lobby.cancel"></button>
      </div>

      <div id="lobby-joining" class="hidden">
        <p><span class="spinner"></span> <span id="joining-msg"></span></p>
        <button id="cancel-join" class="ghost" data-i18n="lobby.cancel"></button>
      </div>
    </div>
  </div>

  <div id="chat-pop" class="chat-pop hidden" role="dialog">
    <div class="chat-head">
      <b data-i18n="chat.title"></b>
      <button id="chat-mute" class="linkbtn"></button>
      <button id="chat-close" class="ghost icon">✕</button>
    </div>
    <div id="chat-hist" class="chat-hist"></div>
    <div id="chat-phrases" class="chat-phrases"></div>
    <div id="chat-emojis" class="chat-emojis"></div>
    <form id="chat-form" class="chat-form hidden">
      <input id="chat-input" maxlength="200" autocomplete="off" data-i18n-ph="chat.ph">
      <button type="submit" data-i18n="chat.send"></button>
    </form>
    <p id="chat-note" class="chat-note" data-i18n="chat.textNote"></p>
  </div>

  <div id="fb" class="fb-wrap hidden">
    <div class="modal fb">
      <h3 data-i18n="fb.title"></h3>
      <p class="sub" data-i18n="fb.sub"></p>
      <textarea id="fb-msg" maxlength="2000" rows="5" data-i18n-ph="fb.ph"></textarea>
      <input id="fb-contact" maxlength="200" type="email" autocomplete="email" data-i18n-ph="fb.contact">
      <p id="fb-note" class="err"></p>
      <div class="fb-btns">
        <button id="fb-cancel" class="ghost" data-i18n="fb.cancel"></button>
        <button id="fb-send" data-i18n="fb.send"></button>
      </div>
    </div>
  </div>

  <div id="consent" class="consent hidden" role="dialog">
    <p data-i18n-html="consent.text"></p>
    <div class="consent-btns">
      <a href="privacy.html" target="_blank" rel="noopener" data-i18n="consent.more"></a>
      <button id="consent-no" class="ghost" data-i18n="consent.no"></button>
      <button id="consent-yes" data-i18n="consent.yes"></button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
  <script src="i18n.js"></script>
  <script src="analytics.js"></script>
  <script src="online.js"></script>
  <script src="sound.js"></script>
  <script src="rules.js"></script>
  <script src="core.js"></script>
  <script src="tutorial.js"></script>
  <script src="puzzles.js"></script>
  <script src="game.js"></script>
</body>
</html>
